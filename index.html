<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit 🥁</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Drum Kit 🥁</h1>
        <p class="instructions">Press keys A-S-D-F-G-H-J-K-L or click the pads</p>
        <div class="drums">
            <div class="drum-pad" data-key="65">
                <img src="images/crash.svg" alt="Crash Cymbal" class="drum-image">
                <span class="key">A</span>
                <span class="sound">crash</span>
            </div>
            <div class="drum-pad" data-key="83">
                <img src="images/tom1.svg" alt="Tom 1" class="drum-image">
                <span class="key">S</span>
                <span class="sound">tom-1</span>
            </div>
            <div class="drum-pad" data-key="68">
                <img src="images/kick.svg" alt="Kick Drum" class="drum-image">
                <span class="key">D</span>
                <span class="sound">kick-bass</span>
            </div>
            <div class="drum-pad" data-key="70">
                <img src="images/tom2.svg" alt="Tom 2" class="drum-image">
                <span class="key">F</span>
                <span class="sound">tom-2</span>
            </div>
            <div class="drum-pad" data-key="71">
                <img src="images/tom3.svg" alt="Tom 3" class="drum-image">
                <span class="key">G</span>
                <span class="sound">tom-3</span>
            </div>
            <div class="drum-pad" data-key="72">
                <img src="images/tom4.svg" alt="Tom 4" class="drum-image">
                <span class="key">H</span>
                <span class="sound">tom-4</span>
            </div>
            <div class="drum-pad" data-key="74">
                <img src="images/snare.svg" alt="Snare Drum" class="drum-image">
                <span class="key">J</span>
                <span class="sound">snare</span>
            </div>
            <div class="drum-pad" data-key="75">
                <img src="images/crash.svg" alt="Crash Cymbal" class="drum-image">
                <span class="key">K</span>
                <span class="sound">crash</span>
            </div>
            <div class="drum-pad" data-key="76">
                <img src="images/kick.svg" alt="Kick Drum" class="drum-image">
                <span class="key">L</span>
                <span class="sound">kick-bass</span>
            </div>
        </div>
    </div>

    <audio data-key="65" src="sounds/crash.mp3" preload="auto"></audio>
    <audio data-key="83" src="sounds/tom-1.mp3" preload="auto"></audio>
    <audio data-key="68" src="sounds/kick-bass.mp3" preload="auto"></audio>
    <audio data-key="70" src="sounds/tom-2.mp3" preload="auto"></audio>
    <audio data-key="71" src="sounds/tom-3.mp3" preload="auto"></audio>
    <audio data-key="72" src="sounds/tom-4.mp3" preload="auto"></audio>
    <audio data-key="74" src="sounds/snare.mp3" preload="auto"></audio>
    <audio data-key="75" src="sounds/crash.mp3" preload="auto"></audio>
    <audio data-key="76" src="sounds/kick-bass.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
