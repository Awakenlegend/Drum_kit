<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <style>
        .crash-outer { fill: none; stroke: #ffc600; stroke-width: 4; }
        .crash-middle { fill: none; stroke: #ffc600; stroke-width: 2; }
        .crash-inner { fill: none; stroke: #ffc600; stroke-width: 1; }
        .crash-center { fill: #ffc600; }
    </style>
    <circle class="crash-outer" cx="50" cy="50" r="40"/>
    <circle class="crash-middle" cx="50" cy="50" r="30"/>
    <circle class="crash-inner" cx="50" cy="50" r="20"/>
    <circle class="crash-center" cx="50" cy="50" r="5"/>
</svg> 