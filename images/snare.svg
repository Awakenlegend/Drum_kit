<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <style>
        .snare-body { fill: #ffc600; stroke: #ffc600; stroke-width: 2; }
        .snare-inner { fill: none; stroke: #000; stroke-width: 1; }
        .snare-cross { stroke: #000; stroke-width: 1; }
    </style>
    <circle class="snare-body" cx="50" cy="50" r="30"/>
    <circle class="snare-inner" cx="50" cy="50" r="25"/>
    <line class="snare-cross" x1="20" y1="50" x2="80" y2="50"/>
    <line class="snare-cross" x1="50" y1="20" x2="50" y2="80"/>
</svg> 